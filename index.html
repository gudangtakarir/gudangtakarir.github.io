<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Explorer - GitHub Pages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .file-item:hover { background-color: #f3f4f6; }
    </style>
</head>
<body class="bg-gray-50 p-4 md:p-10">

    <div class="max-w-3xl mx-auto bg-white shadow-md rounded-lg overflow-hidden border border-gray-200">
        <div class="bg-gray-800 p-4">
            <h1 id="repo-title" class="text-white font-mono text-lg">Loading Repository...</h1>
        </div>
        
        <div id="file-list" class="divide-y divide-gray-200">
            <!-- Daftar file akan muncul di sini -->
            <div class="p-4 text-center text-gray-500">Memuat daftar file...</div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI ---
        const USERNAME = 'gudangtakarir'; // Ganti dengan username GitHub Anda
        const REPO = 'gudangtakarir.github.io';     // Ganti dengan nama repositori Anda
        // ------------------

        const fileListContainer = document.getElementById('file-list');
        const repoTitle = document.getElementById('repo-title');

        repoTitle.innerText = `Index of /${REPO}`;

        async function fetchFiles() {
            try {
                const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/`);
                const items = await response.json();

                if (response.status !== 200) throw new Error(items.message);

                fileListContainer.innerHTML = '';

                // Urutkan: Folder dulu, baru file
                items.sort((a, b) => (b.type === 'dir') - (a.type === 'dir'));

                items.forEach(item => {
                    // Jangan tampilkan file index.html itu sendiri
                    if (item.name === 'index.html') return;

                    const icon = item.type === 'dir' ? '📁' : '📄';
                    const link = item.type === 'dir' 
                        ? `https://${USERNAME}.github.io/${REPO}/${item.path}/` 
                        : item.path;

                    const row = `
                        <a href="${link}" class="file-item flex items-center p-4 transition duration-150">
                            <span class="mr-3 text-xl">${icon}</span>
                            <span class="text-blue-600 hover:underline font-medium">${item.name}</span>
                            <span class="ml-auto text-xs text-gray-400 font-mono">${item.type.toUpperCase()}</span>
                        </a>
                    `;
                    fileListContainer.innerHTML += row;
                });

            } catch (error) {
                fileListContainer.innerHTML = `<div class="p-4 text-red-500">Error: ${error.message}. <br>Pastikan Username dan Nama Repo sudah benar di dalam kode.</div>`;
            }
        }

        fetchFiles();
    </script>
</body>
</html>
